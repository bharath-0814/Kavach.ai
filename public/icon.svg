<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#030305" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="4" />
  
  <!-- Outer Shield Glow -->
  <path d="M256 70 L390 120 C390 280 256 420 256 420 C256 420 122 280 122 120 Z" 
        fill="url(#shieldGrad)" opacity="0.25" filter="url(#glow)" />
        
  <!-- Main Shield Body -->
  <path d="M256 90 L370 135 C370 270 256 390 256 390 C256 390 142 270 142 135 Z" 
        fill="url(#shieldGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="4" />
        
  <!-- Inner Glass Specular -->
  <path d="M256 100 L355 140 C355 210 320 300 256 360 C192 300 157 210 157 140 Z" 
        fill="url(#glowGrad)" opacity="0.3" />
        
  <!-- Shield Center Radar / AI Core -->
  <circle cx="256" cy="220" r="45" fill="#09090b" stroke="#38bdf8" stroke-width="6" />
  <circle cx="256" cy="220" r="22" fill="#38bdf8" />
  <path d="M256 275 L256 320" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
  <path d="M210 240 L180 265" stroke="#a855f7" stroke-width="6" stroke-linecap="round" />
  <path d="M302 240 L332 265" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
</svg>
